apiVersion: v1
kind: Namespace
metadata:
  name: mywork
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myapp-rs
  namespace: mywork
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: nginx
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
