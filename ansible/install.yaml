- name: install apache based on OS
  hosts: all
  become: true
  gather_facts: yes

  tasks:
    - name: install httpd on redhat
      yum:
        name: httpd
        state: present
      when: ansible_os_family == "RedHat"

    - name: install apache2 on debian
      apt:
        name: apache2
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"


   

